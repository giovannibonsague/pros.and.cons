<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pros & Cons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pro:#2f7d5f;
    --pro-light:#e7f4ee;
    --con:#b0453e;
    --con-light:#fbeae8;
    --ink:#1f2320;
    --paper:#faf8f3;
    --line:#ddd7c9;
    --sidebar-w:260px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
  }

  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:#fff;
    border-right:2px solid var(--line);
    height:100vh;
    position:sticky;
    top:0;
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    padding:20px 18px 14px;
    border-bottom:2px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sidebar-header h1{
    font-size:16px;
    margin:0;
    letter-spacing:.02em;
  }
  .new-btn{
    width:30px;
    height:30px;
    border-radius:8px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .new-btn:hover{ opacity:.85; }

  .comparisons{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .comp-item{
    padding:12px 14px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
    position:relative;
  }
  .comp-item:hover{ background:var(--paper); }
  .comp-item.active{
    background:var(--paper);
    border-color:var(--line);
  }
  .comp-name{
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding-right:20px;
  }
  .comp-name.placeholder{ color:#b6b0a0; font-weight:400; }
  .comp-tally{
    font-size:12px;
    color:#8a8570;
    margin-top:3px;
  }
  .comp-tally .p{ color:var(--pro); font-weight:600; }
  .comp-tally .c{ color:var(--con); font-weight:600; }
  .comp-del{
    position:absolute;
    top:8px;
    right:8px;
    border:none;
    background:transparent;
    color:#c2bca8;
    font-size:15px;
    cursor:pointer;
    display:none;
    width:20px;
    height:20px;
  }
  .comp-item:hover .comp-del{ display:block; }
  .comp-del:hover{ color:var(--con); }

  .sidebar-footer{
    padding:12px 18px;
    font-size:11px;
    color:#b6b0a0;
    border-top:1px solid var(--line);
  }

  .main{
    flex:1;
    padding:32px 40px 80px;
    max-width:900px;
  }
  .no-selection{
    text-align:center;
    color:#b6b0a0;
    margin-top:120px;
    font-size:16px;
  }

  .title-row{
    margin-bottom:8px;
  }
  #mainThing{
    font-size:clamp(26px, 4vw, 38px);
    font-weight:700;
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    color:var(--ink);
    padding:4px 2px;
    outline:none;
    width:100%;
    font-family:inherit;
  }
  #mainThing:hover, #mainThing:focus{
    border-bottom:3px solid var(--line);
  }
  #mainThing::placeholder{ color:#b6b0a0; }

  .subtitle{
    color:#8a8570;
    font-size:13px;
    margin-bottom:26px;
    letter-spacing:.02em;
  }

  .scoreboard{
    display:flex;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .score{
    padding:10px 22px;
    border-radius:14px;
    font-weight:700;
    font-size:17px;
    display:flex;
    align-items:center;
    gap:8px;
    border:2px solid;
  }
  .score.pro{ background:var(--pro-light); border-color:var(--pro); color:var(--pro); }
  .score.con{ background:var(--con-light); border-color:var(--con); color:var(--con); }
  .score .num{ font-size:24px; }
  .winner{
    font-size:13px;
    color:#8a8570;
    margin:-18px 0 26px;
    min-height:16px;
  }

  .columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:640px){
    .columns{grid-template-columns:1fr;}
  }

  .col{
    background:#fff;
    border-radius:18px;
    border:2px solid var(--line);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .col-header{
    padding:14px 18px;
    font-weight:700;
    font-size:18px;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .col.pros .col-header{ background:var(--pro); }
  .col.cons .col-header{ background:var(--con); }

  .add-btn{
    background:rgba(255,255,255,.25);
    border:none;
    color:#fff;
    width:30px;
    height:30px;
    border-radius:8px;
    font-size:19px;
    cursor:pointer;
    line-height:1;
  }
  .add-btn:hover{ background:rgba(255,255,255,.4); }

  .items{
    list-style:none;
    margin:0;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:70px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border-radius:10px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .item input.text{
    flex:1;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  .item input.text::placeholder{ color:#b6b0a0; }

  .tally{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:#8a8570;
    white-space:nowrap;
  }
  .tally-marks{
    font-weight:600;
    min-width:14px;
    text-align:center;
  }
  .col.pros .tally-marks{ color:var(--pro); }
  .col.cons .tally-marks{ color:var(--con); }

  .tally button{
    width:22px;
    height:22px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    color:var(--ink);
  }
  .tally button:hover{ background:var(--line); }

  .del{
    border:none;
    background:transparent;
    color:#c2bca8;
    cursor:pointer;
    font-size:16px;
    width:20px;
  }
  .del:hover{ color:var(--con); }

  .empty-hint{
    text-align:center;
    color:#b6b0a0;
    font-size:13px;
    padding:10px;
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Comparisons</h1>
    <button class="new-btn" onclick="newComparison()" title="New comparison">+</button>
  </div>
  <div class="comparisons" id="comparisonList"></div>
  <div class="sidebar-footer">Stored locally in this browser</div>
</div>

<div class="main" id="main">
  <div class="no-selection" id="noSelection">Select a comparison on the left, or start a new one.</div>

  <div id="content" style="display:none;">
    <div class="title-row">
      <input id="mainThing" type="text" placeholder="What are you deciding?" />
    </div>
    <div class="subtitle">changes save automatically</div>

    <div class="scoreboard">
      <div class="score pro"><span class="num" id="proCount">0</span> Pros</div>
      <div class="score con"><span class="num" id="conCount">0</span> Cons</div>
    </div>
    <div class="winner" id="winnerLine"></div>

    <div class="columns">
      <div class="col pros">
        <div class="col-header">
          Pros
          <button class="add-btn" onclick="addItem('pros')">+</button>
        </div>
        <ul class="items" id="prosList"></ul>
      </div>
      <div class="col cons">
        <div class="col-header">
          Cons
          <button class="add-btn" onclick="addItem('cons')">+</button>
        </div>
        <ul class="items" id="consList"></ul>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'prosConsComparisons';
const ACTIVE_KEY = 'prosConsActiveId';

function loadAll(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}

let comparisons = loadAll();
let activeId = localStorage.getItem(ACTIVE_KEY) || null;

function saveAll(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(comparisons));
}
function saveActive(){
  if(activeId) localStorage.setItem(ACTIVE_KEY, activeId);
}

function genId(){
  return 'c' + Date.now() + Math.random().toString(36).slice(2,7);
}

function newComparison(){
  const comp = { id: genId(), title:'', pros:[], cons:[] };
  comparisons.unshift(comp);
  activeId = comp.id;
  saveAll();
  saveActive();
  renderSidebar();
  renderMain();
  requestAnimationFrame(() => document.getElementById('mainThing').focus());
}

function selectComparison(id){
  activeId = id;
  saveActive();
  renderSidebar();
  renderMain();
}

function deleteComparison(id, evt){
  evt.stopPropagation();
  comparisons = comparisons.filter(c => c.id !== id);
  if(activeId === id){
    activeId = comparisons.length ? comparisons[0].id : null;
    saveActive();
  }
  saveAll();
  renderSidebar();
  renderMain();
}

function getActive(){
  return comparisons.find(c => c.id === activeId) || null;
}

function renderSidebar(){
  const list = document.getElementById('comparisonList');
  list.innerHTML = '';
  comparisons.forEach(comp => {
    const div = document.createElement('div');
    div.className = 'comp-item' + (comp.id === activeId ? ' active' : '');
    div.onclick = () => selectComparison(comp.id);

    const name = document.createElement('div');
    name.className = 'comp-name' + (comp.title ? '' : ' placeholder');
    name.textContent = comp.title || 'Untitled';

    const tally = document.createElement('div');
    tally.className = 'comp-tally';
    tally.innerHTML = `<span class="p">${comp.pros.length}</span> pros \u00b7 <span class="c">${comp.cons.length}</span> cons`;

    const delBtn = document.createElement('button');
    delBtn.className = 'comp-del';
    delBtn.textContent = '\u00d7';
    delBtn.onclick = (e) => deleteComparison(comp.id, e);

    div.appendChild(name);
    div.appendChild(tally);
    div.appendChild(delBtn);
    list.appendChild(div);
  });
}

function renderMain(){
  const comp = getActive();
  const noSel = document.getElementById('noSelection');
  const content = document.getElementById('content');

  if(!comp){
    noSel.style.display = 'block';
    content.style.display = 'none';
    return;
  }
  noSel.style.display = 'none';
  content.style.display = 'block';

  const mainThing = document.getElementById('mainThing');
  mainThing.value = comp.title || '';
  mainThing.oninput = () => {
    comp.title = mainThing.value;
    saveAll();
    renderSidebar();
  };

  renderList('pros', 'prosList', comp);
  renderList('cons', 'consList', comp);
  updateScoreboard(comp);
}

function addItem(type){
  const comp = getActive();
  if(!comp) return;
  comp[type].push({ text:'', tally:0 });
  saveAll();
  renderMain();
  renderSidebar();
  requestAnimationFrame(() => {
    const list = document.getElementById(type === 'pros' ? 'prosList' : 'consList');
    const inputs = list.querySelectorAll('input.text');
    if(inputs.length) inputs[inputs.length-1].focus();
  });
}

function removeItem(type, idx){
  const comp = getActive();
  comp[type].splice(idx,1);
  saveAll();
  renderMain();
  renderSidebar();
}

function updateText(type, idx, val){
  const comp = getActive();
  comp[type][idx].text = val;
  saveAll();
}

function changeTally(type, idx, delta){
  const comp = getActive();
  const item = comp[type][idx];
  item.tally = Math.max(0, item.tally + delta);
  saveAll();
  renderMain();
}

function renderList(type, listId, comp){
  const list = document.getElementById(listId);
  list.innerHTML = '';
  const items = comp[type];

  if(items.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'Click + to add a ' + (type === 'pros' ? 'pro' : 'con');
    list.appendChild(hint);
    return;
  }

  items.forEach((item, idx) => {
    const li = document.createElement('li');
    li.className = 'item';

    const textInput = document.createElement('input');
    textInput.className = 'text';
    textInput.type = 'text';
    textInput.placeholder = type === 'pros' ? 'Reason for...' : 'Reason against...';
    textInput.value = item.text;
    textInput.addEventListener('input', (e) => updateText(type, idx, e.target.value));

    const tallyWrap = document.createElement('div');
    tallyWrap.className = 'tally';

    const minusBtn = document.createElement('button');
    minusBtn.textContent = '\u2212';
    minusBtn.onclick = () => changeTally(type, idx, -1);

    const marks = document.createElement('span');
    marks.className = 'tally-marks';
    marks.textContent = item.tally;

    const plusBtn = document.createElement('button');
    plusBtn.textContent = '+';
    plusBtn.onclick = () => changeTally(type, idx, 1);

    tallyWrap.appendChild(minusBtn);
    tallyWrap.appendChild(marks);
    tallyWrap.appendChild(plusBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '\u00d7';
    delBtn.onclick = () => removeItem(type, idx);

    li.appendChild(textInput);
    li.appendChild(tallyWrap);
    li.appendChild(delBtn);
    list.appendChild(li);
  });
}

function updateScoreboard(comp){
  const proTotal = comp.pros.length;
  const conTotal = comp.cons.length;
  document.getElementById('proCount').textContent = proTotal;
  document.getElementById('conCount').textContent = conTotal;

  const winnerLine = document.getElementById('winnerLine');
  if(proTotal === 0 && conTotal === 0){
    winnerLine.textContent = '';
  } else if(proTotal > conTotal){
    winnerLine.textContent = `Pros ahead by ${proTotal - conTotal}`;
  } else if(conTotal > proTotal){
    winnerLine.textContent = `Cons ahead by ${conTotal - proTotal}`;
  } else {
    winnerLine.textContent = "It's a tie";
  }
}

if(!comparisons.find(c => c.id === activeId)){
  activeId = comparisons.length ? comparisons[0].id : null;
}
renderSidebar();
renderMain();
</script>
</body>
</html>
