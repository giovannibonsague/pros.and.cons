<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pros & Cons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pro:#2f7d5f;
    --pro-light:#e7f4ee;
    --con:#b0453e;
    --con-light:#fbeae8;
    --ink:#1f2320;
    --paper:#faf8f3;
    --card:#ffffff;
    --line:#ddd7c9;
    --muted:#8a8570;
    --muted-light:#b6b0a0;
    --sidebar-w:260px;
  }

  body[data-theme="dark"]{
    --ink:#f0ede4;
    --paper:#1b1c19;
    --card:#242522;
    --line:#3a3b36;
    --muted:#a19c8a;
    --muted-light:#6f6b5c;
    --pro-light:#1e3129;
    --con-light:#32211f;
  }

  body[data-colors="off"]{
    --pro:#4a4a48;
    --pro-light:var(--card);
    --con:#4a4a48;
    --con-light:var(--card);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    transition:background .25s ease, color .25s ease;
  }

  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--card);
    border-right:2px solid var(--line);
    height:100vh;
    position:sticky;
    top:0;
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    padding:20px 18px 14px;
    border-bottom:2px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sidebar-header h1{
    font-size:16px;
    margin:0;
    letter-spacing:.02em;
  }
  .new-btn{
    width:30px;
    height:30px;
    border-radius:8px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .new-btn:hover{ opacity:.85; }

  .comparisons{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .comp-item{
    padding:12px 14px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
    position:relative;
  }
  .comp-item:hover{ background:var(--paper); }
  .comp-item.active{
    background:var(--paper);
    border-color:var(--line);
  }
  .comp-name{
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding-right:20px;
  }
  .comp-name.placeholder{ color:var(--muted-light); font-weight:400; }
  .comp-tally{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
  }
  .comp-tally .p{ color:var(--pro); font-weight:600; }
  .comp-tally .c{ color:var(--con); font-weight:600; }
  .comp-del{
    position:absolute;
    top:8px;
    right:8px;
    border:none;
    background:transparent;
    color:var(--muted-light);
    font-size:15px;
    cursor:pointer;
    display:none;
    width:20px;
    height:20px;
  }
  .comp-item:hover .comp-del{ display:block; }
  .comp-del:hover{ color:var(--con); }

  .sidebar-footer{
    padding:12px 18px;
    font-size:11px;
    color:var(--muted-light);
    border-top:1px solid var(--line);
  }

  .main{
    flex:1;
    padding:32px 40px 80px;
    max-width:900px;
  }
  .no-selection{
    text-align:center;
    color:var(--muted-light);
    margin-top:120px;
    font-size:16px;
  }

  .title-row{
    margin-bottom:8px;
  }
  #mainThing{
    font-size:clamp(26px, 4vw, 38px);
    font-weight:700;
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    color:var(--ink);
    padding:4px 2px;
    outline:none;
    width:100%;
    font-family:inherit;
  }
  #mainThing:hover, #mainThing:focus{
    border-bottom:3px solid var(--line);
  }
  #mainThing::placeholder{ color:var(--muted-light); }

  .subtitle{
    color:var(--muted);
    font-size:13px;
    margin-bottom:26px;
    letter-spacing:.02em;
  }

  .scoreboard{
    display:flex;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .score{
    padding:10px 22px;
    border-radius:14px;
    font-weight:700;
    font-size:17px;
    display:flex;
    align-items:center;
    gap:8px;
    border:2px solid;
  }
  .score.pro{ background:var(--pro-light); border-color:var(--pro); color:var(--pro); }
  .score.con{ background:var(--con-light); border-color:var(--con); color:var(--con); }
  .score .num{ font-size:24px; }
  .winner{
    font-size:13px;
    color:var(--muted);
    margin:-18px 0 26px;
    min-height:16px;
  }

  .columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:640px){
    .columns{grid-template-columns:1fr;}
  }

  .col{
    background:var(--card);
    border-radius:18px;
    border:2px solid var(--line);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .col-header{
    padding:14px 18px;
    font-weight:700;
    font-size:18px;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .col.pros .col-header{ background:var(--pro); }
  .col.cons .col-header{ background:var(--con); }

  .add-btn{
    background:rgba(255,255,255,.25);
    border:none;
    color:#fff;
    width:30px;
    height:30px;
    border-radius:8px;
    font-size:19px;
    cursor:pointer;
    line-height:1;
  }
  .add-btn:hover{ background:rgba(255,255,255,.4); }

  .items{
    list-style:none;
    margin:0;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:70px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border-radius:10px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .item input.text{
    flex:1;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  .item input.text::placeholder{ color:var(--muted-light); }

  .tally{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:var(--muted);
    white-space:nowrap;
  }
  .tally-marks{
    font-weight:600;
    min-width:14px;
    text-align:center;
  }
  .col.pros .tally-marks{ color:var(--pro); }
  .col.cons .tally-marks{ color:var(--con); }

  .tally button{
    width:22px;
    height:22px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    font-size:13px;
    line-height:1;
    color:var(--ink);
  }
  .tally button:hover{ background:var(--line); }

  .del{
    border:none;
    background:transparent;
    color:var(--muted-light);
    cursor:pointer;
    font-size:16px;
    width:20px;
  }
  .del:hover{ color:var(--con); }

  .empty-hint{
    text-align:center;
    color:var(--muted-light);
    font-size:13px;
    padding:10px;
  }

  /* ANIMATIONS */
  @keyframes slideIn{
    from{ opacity:0; transform:translateY(-8px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes slideOut{
    from{ opacity:1; transform:translateX(0); max-height:60px; margin-bottom:8px; }
    to{ opacity:0; transform:translateX(12px); max-height:0; margin-bottom:0; padding-top:0; padding-bottom:0; }
  }
  @keyframes bump{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.35); }
    100%{ transform:scale(1); }
  }
  @keyframes fadeSlide{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .item{ animation:slideIn .22s ease; transition:background .2s ease, border-color .2s ease, transform .15s ease; }
  .item.removing{ animation:slideOut .2s ease forwards; overflow:hidden; }
  .item:hover{ transform:translateY(-1px); }

  .tally-marks.bump{ animation:bump .28s ease; }

  .col, .comp-item, .score, #mainThing, .new-btn, .add-btn, .tally button, .del, .comp-del{
    transition:background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease, box-shadow .2s ease;
  }
  .add-btn:active, .new-btn:active, .tally button:active{ transform:scale(.88); }
  .comp-item{ animation:fadeSlide .2s ease; }
  .comp-item:hover{ transform:translateX(2px); }

  .content-fade{ animation:fadeSlide .25s ease; }

  /* SETTINGS */
  .settings-wrap{
    border-top:1px solid var(--line);
    padding:10px;
  }
  .settings-toggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:transparent;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
  }
  .settings-toggle:hover{ background:var(--paper); }
  .settings-toggle .chev{
    transition:transform .2s ease;
    color:var(--muted);
  }
  .settings-toggle.open .chev{ transform:rotate(180deg); }

  .settings-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .settings-panel.open{ max-height:280px; }

  .settings-group{
    padding:10px 12px 4px;
  }
  .settings-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    margin-bottom:8px;
    font-weight:600;
  }
  .settings-options{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .settings-btn{
    flex:1;
    min-width:70px;
    padding:8px 6px;
    border-radius:8px;
    border:2px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .settings-btn:hover{ border-color:var(--muted); }
  .settings-btn.active{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--paper);
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Comparisons</h1>
    <button class="new-btn" onclick="newComparison()" title="New comparison">+</button>
  </div>
  <div class="comparisons" id="comparisonList"></div>

  <div class="settings-wrap">
    <button class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">
      Settings
      <span class="chev">&#9662;</span>
    </button>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-group">
        <div class="settings-label">Theme</div>
        <div class="settings-options" id="themeOptions">
          <button class="settings-btn" data-value="light" onclick="setTheme('light')">Light</button>
          <button class="settings-btn" data-value="dark" onclick="setTheme('dark')">Dark</button>
          <button class="settings-btn" data-value="system" onclick="setTheme('system')">System</button>
        </div>
        <div class="settings-label">Color style</div>
        <div class="settings-options" id="colorOptions">
          <button class="settings-btn" data-value="on" onclick="setColors('on')">Colors</button>
          <button class="settings-btn" data-value="off" onclick="setColors('off')">No colors</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">Stored locally in this browser</div>
</div>

<div class="main" id="main">
  <div class="no-selection" id="noSelection">Select a comparison on the left, or start a new one.</div>

  <div id="content" class="content-fade" style="display:none;">
    <div class="title-row">
      <input id="mainThing" type="text" placeholder="What are you deciding?" />
    </div>
    <div class="subtitle">changes save automatically</div>

    <div class="scoreboard">
      <div class="score pro"><span class="num" id="proCount">0</span> Pros</div>
      <div class="score con"><span class="num" id="conCount">0</span> Cons</div>
    </div>
    <div class="winner" id="winnerLine"></div>

    <div class="columns">
      <div class="col pros">
        <div class="col-header">
          Pros
          <button class="add-btn" onclick="addItem('pros')">+</button>
        </div>
        <ul class="items" id="prosList"></ul>
      </div>
      <div class="col cons">
        <div class="col-header">
          Cons
          <button class="add-btn" onclick="addItem('cons')">+</button>
        </div>
        <ul class="items" id="consList"></ul>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'prosConsComparisons';
const ACTIVE_KEY = 'prosConsActiveId';
const SETTINGS_KEY = 'prosConsSettings';

function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { theme:'system', colors:'on' };
}

let settings = loadSettings();

function saveSettings(){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function applySettings(){
  const body = document.body;
  let effectiveTheme = settings.theme;
  if(effectiveTheme === 'system'){
    effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  body.setAttribute('data-theme', effectiveTheme);
  body.setAttribute('data-colors', settings.colors);

  document.querySelectorAll('#themeOptions .settings-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.value === settings.theme);
  });
  document.querySelectorAll('#colorOptions .settings-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.value === settings.colors);
  });
}

function setTheme(value){
  settings.theme = value;
  saveSettings();
  applySettings();
}

function setColors(value){
  settings.colors = value;
  saveSettings();
  applySettings();
}

function toggleSettings(){
  const panel = document.getElementById('settingsPanel');
  const toggle = document.getElementById('settingsToggle');
  panel.classList.toggle('open');
  toggle.classList.toggle('open');
}

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if(settings.theme === 'system') applySettings();
  });
}

function loadAll(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}

let comparisons = loadAll();
let activeId = localStorage.getItem(ACTIVE_KEY) || null;

function saveAll(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(comparisons));
}
function saveActive(){
  if(activeId) localStorage.setItem(ACTIVE_KEY, activeId);
}

function genId(){
  return 'c' + Date.now() + Math.random().toString(36).slice(2,7);
}

function newComparison(){
  const comp = { id: genId(), title:'', pros:[], cons:[] };
  comparisons.unshift(comp);
  activeId = comp.id;
  saveAll();
  saveActive();
  renderSidebar();
  renderMain();
  requestAnimationFrame(() => document.getElementById('mainThing').focus());
}

function selectComparison(id){
  activeId = id;
  saveActive();
  renderSidebar();
  renderMain();
}

function deleteComparison(id, evt){
  evt.stopPropagation();
  comparisons = comparisons.filter(c => c.id !== id);
  if(activeId === id){
    activeId = comparisons.length ? comparisons[0].id : null;
    saveActive();
  }
  saveAll();
  renderSidebar();
  renderMain();
}

function getActive(){
  return comparisons.find(c => c.id === activeId) || null;
}

function renderSidebar(){
  const list = document.getElementById('comparisonList');
  list.innerHTML = '';
  comparisons.forEach(comp => {
    const div = document.createElement('div');
    div.className = 'comp-item' + (comp.id === activeId ? ' active' : '');
    div.onclick = () => selectComparison(comp.id);

    const name = document.createElement('div');
    name.className = 'comp-name' + (comp.title ? '' : ' placeholder');
    name.textContent = comp.title || 'Untitled';

    const tally = document.createElement('div');
    tally.className = 'comp-tally';
    tally.innerHTML = `<span class="p">${comp.pros.length}</span> pros \u00b7 <span class="c">${comp.cons.length}</span> cons`;

    const delBtn = document.createElement('button');
    delBtn.className = 'comp-del';
    delBtn.textContent = '\u00d7';
    delBtn.onclick = (e) => deleteComparison(comp.id, e);

    div.appendChild(name);
    div.appendChild(tally);
    div.appendChild(delBtn);
    list.appendChild(div);
  });
}

function renderMain(){
  const comp = getActive();
  const noSel = document.getElementById('noSelection');
  const content = document.getElementById('content');

  if(!comp){
    noSel.style.display = 'block';
    content.style.display = 'none';
    return;
  }
  noSel.style.display = 'none';
  content.style.display = 'block';

  const mainThing = document.getElementById('mainThing');
  mainThing.value = comp.title || '';
  mainThing.oninput = () => {
    comp.title = mainThing.value;
    saveAll();
    renderSidebar();
  };

  renderList('pros', 'prosList', comp);
  renderList('cons', 'consList', comp);
  updateScoreboard(comp);
}

function addItem(type){
  const comp = getActive();
  if(!comp) return;
  comp[type].push({ text:'', tally:0 });
  saveAll();
  renderMain();
  renderSidebar();
  requestAnimationFrame(() => {
    const list = document.getElementById(type === 'pros' ? 'prosList' : 'consList');
    const inputs = list.querySelectorAll('input.text');
    if(inputs.length) inputs[inputs.length-1].focus();
  });
}

function removeItem(type, idx, li){
  const doRemove = () => {
    const comp = getActive();
    comp[type].splice(idx,1);
    saveAll();
    renderMain();
    renderSidebar();
  };
  if(li){
    li.classList.add('removing');
    li.addEventListener('animationend', doRemove, { once:true });
  } else {
    doRemove();
  }
}

function updateText(type, idx, val){
  const comp = getActive();
  comp[type][idx].text = val;
  saveAll();
}

let lastBumped = null;

function changeTally(type, idx, delta){
  const comp = getActive();
  const item = comp[type][idx];
  item.tally = Math.max(0, item.tally + delta);
  saveAll();
  lastBumped = type + '-' + idx;
  renderMain();
}

function renderList(type, listId, comp){
  const list = document.getElementById(listId);
  list.innerHTML = '';
  const items = comp[type];

  if(items.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'Click + to add a ' + (type === 'pros' ? 'pro' : 'con');
    list.appendChild(hint);
    return;
  }

  items.forEach((item, idx) => {
    const li = document.createElement('li');
    li.className = 'item';

    const textInput = document.createElement('input');
    textInput.className = 'text';
    textInput.type = 'text';
    textInput.placeholder = type === 'pros' ? 'Reason for...' : 'Reason against...';
    textInput.value = item.text;
    textInput.addEventListener('input', (e) => updateText(type, idx, e.target.value));

    const tallyWrap = document.createElement('div');
    tallyWrap.className = 'tally';

    const minusBtn = document.createElement('button');
    minusBtn.textContent = '\u2212';
    minusBtn.onclick = () => changeTally(type, idx, -1);

    const marks = document.createElement('span');
    marks.className = 'tally-marks';
    marks.textContent = item.tally;
    if(lastBumped === type + '-' + idx){
      marks.classList.add('bump');
      requestAnimationFrame(() => {
        setTimeout(() => { lastBumped = null; }, 300);
      });
    }

    const plusBtn = document.createElement('button');
    plusBtn.textContent = '+';
    plusBtn.onclick = () => changeTally(type, idx, 1);

    tallyWrap.appendChild(minusBtn);
    tallyWrap.appendChild(marks);
    tallyWrap.appendChild(plusBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '\u00d7';
    delBtn.onclick = () => removeItem(type, idx, li);

    li.appendChild(textInput);
    li.appendChild(tallyWrap);
    li.appendChild(delBtn);
    list.appendChild(li);
  });
}

function updateScoreboard(comp){
  const proTotal = comp.pros.length;
  const conTotal = comp.cons.length;
  document.getElementById('proCount').textContent = proTotal;
  document.getElementById('conCount').textContent = conTotal;

  const winnerLine = document.getElementById('winnerLine');
  if(proTotal === 0 && conTotal === 0){
    winnerLine.textContent = '';
  } else if(proTotal > conTotal){
    winnerLine.textContent = `Pros ahead by ${proTotal - conTotal}`;
  } else if(conTotal > proTotal){
    winnerLine.textContent = `Cons ahead by ${conTotal - proTotal}`;
  } else {
    winnerLine.textContent = "It's a tie";
  }
}

if(!comparisons.find(c => c.id === activeId)){
  activeId = comparisons.length ? comparisons[0].id : null;
}
applySettings();
renderSidebar();
renderMain();
</script>
</body>
</html>
